org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.13 needs JDK 17+. Android Studio supplies its own; for command-line builds either export
# JAVA_HOME or set org.gradle.java.home here (it is a machine-specific path, so it is not committed):
#org.gradle.java.home=/path/to/jdk-17-or-newer

# Neutralizes an inherited system proxy: some machines run a local MITM filtering proxy that the
# JVM honours, which silently kills dependency downloads. Pointing at it while bypassing every
# host forces DIRECT connections. On a machine with no such proxy this is a no-op.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=9173
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=9173
systemProp.http.nonProxyHosts=*
systemProp.https.nonProxyHosts=*
